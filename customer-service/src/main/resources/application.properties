spring.application.name=customer-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Logesh@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Resilience4j Circuit Breaker Config for Cashback & Redemption Services
resilience4j.circuitbreaker.instances.cashbackService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cashbackService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cashbackService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cashbackService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.cashbackService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.redemptionService.sliding-window-size=5
resilience4j.circuitbreaker.instances.redemptionService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.redemptionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redemptionService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.redemptionService.permitted-number-of-calls-in-half-open-state=2

# Resilience4j Retry Config
resilience4j.retry.instances.cashbackService.max-attempts=3
resilience4j.retry.instances.cashbackService.wait-duration=500ms

resilience4j.retry.instances.redemptionService.max-attempts=3
resilience4j.retry.instances.redemptionService.wait-duration=500ms

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,circuitbreakers
