server.port=8091
spring.application.name=merchant-alert-service

spring.datasource.url=jdbc:mysql://localhost:3306/merchant_alert_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Logesh@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange.redemption=deals.redemption.exchange
rabbitmq.routingkey.coupon-redeemed=coupon.redeemed
rabbitmq.queue.merchant-alert-redemption=merchant.alert.redemption.queue

rabbitmq.exchange.coupon=deals.coupon.exchange
rabbitmq.routingkey.coupon-created=coupon.created
rabbitmq.queue.merchant-alert-coupon-created=merchant.alert.coupon.created.queue

rabbitmq.exchange.notification=deals.notification.exchange
rabbitmq.routingkey.merchant-alert=merchant.coupon.alert

# Resilience4j Circuit Breaker Config for Merchant Service
resilience4j.circuitbreaker.instances.merchantService.sliding-window-size=5
resilience4j.circuitbreaker.instances.merchantService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.merchantService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.merchantService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.merchantService.permitted-number-of-calls-in-half-open-state=2

# Resilience4j Retry Config
resilience4j.retry.instances.merchantService.max-attempts=3
resilience4j.retry.instances.merchantService.wait-duration=500ms

management.endpoints.web.exposure.include=health,info,prometheus,circuitbreakers
management.endpoint.health.show-details=always
