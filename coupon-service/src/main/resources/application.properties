spring.application.name=coupon-service
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/coupon_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Logesh@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.subscriptionService.sliding-window-size=5
resilience4j.circuitbreaker.instances.subscriptionService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.subscriptionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.subscriptionService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.subscriptionService.permitted-number-of-calls-in-half-open-state=2

# Resilience4j Retry Config
resilience4j.retry.instances.subscriptionService.max-attempts=3
resilience4j.retry.instances.subscriptionService.wait-duration=500ms

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,circuitbreakers
