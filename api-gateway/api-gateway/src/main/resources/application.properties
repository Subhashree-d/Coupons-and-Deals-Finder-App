spring.application.name=API-GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=cashback-service
spring.cloud.gateway.routes[0].uri=lb://CASHBACK-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/cashback/**

spring.cloud.gateway.routes[1].id=notification-service
spring.cloud.gateway.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/notifications/**

jwt.secret=CHANGE_THIS_TO_THE_SAME_SECRET_USED_BY_AUTH_SERVICE
