version: '3.8'

services:
  # -------------------------------------------------------------
  # INFRASTRUCTURE: MySQL Database
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: deals-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - deals-network

  # -------------------------------------------------------------
  # INFRASTRUCTURE: RabbitMQ Message Broker
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: deals-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - deals-network

  # -------------------------------------------------------------
  # INFRASTRUCTURE: Config Server
  # -------------------------------------------------------------
  config-server:
    build: ./config-server
    container_name: deals-config-server
    ports:
      - "8888:8888"
    networks:
      - deals-network

  # -------------------------------------------------------------
  # INFRASTRUCTURE: Eureka Discovery Server
  # -------------------------------------------------------------
  eureka-server:
    build: ./eureka-server
    container_name: deals-eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - deals-network

  # -------------------------------------------------------------
  # INFRASTRUCTURE: API Gateway
  # -------------------------------------------------------------
  api-gateway:
    build: ./api-gateway
    container_name: deals-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - deals-network

  # -------------------------------------------------------------
  # MICROSERVICES
  # -------------------------------------------------------------
  auth-service:
    build: ./auth-service
    container_name: deals-auth-service
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - deals-network

  customer-service:
    build: ./customer-service
    container_name: deals-customer-service
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - deals-network

  merchant-service:
    build: ./merchant-service
    container_name: deals-merchant-service
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - deals-network

  subscription-service:
    build: ./subscription-service
    container_name: deals-subscription-service
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server
    networks:
      - deals-network

  payment-service:
    build: ./payment-service
    container_name: deals-payment-service
    ports:
      - "8085:8085"
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server
    networks:
      - deals-network

  coupon-service:
    build: ./coupon-service
    container_name: deals-coupon-service
    ports:
      - "8086:8086"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - deals-network

  redemption-service:
    build: ./redemption-service
    container_name: deals-redemption-service
    ports:
      - "8087:8087"
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server
    networks:
      - deals-network

  cashback-service:
    build: ./cashback-service
    container_name: deals-cashback-service
    ports:
      - "8088:8088"
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server
    networks:
      - deals-network

  admin-service:
    build: ./admin-service
    container_name: deals-admin-service
    ports:
      - "8089:8089"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - deals-network

  notification-service:
    build: ./notification-service
    container_name: deals-notification-service
    ports:
      - "8090:8090"
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server
    networks:
      - deals-network

  merchant-alert-service:
    build: ./merchant-alert-service
    container_name: deals-merchant-alert-service
    ports:
      - "8091:8091"
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server
    networks:
      - deals-network

volumes:
  mysql-data:

networks:
  deals-network:
    driver: bridge
