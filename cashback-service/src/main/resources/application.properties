spring.application.name=cashback-service
server.port=8088

spring.datasource.url=jdbc:mysql://localhost:3306/cashback_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Logesh@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange.redemption=deals.redemption.exchange
rabbitmq.queue.coupon-redeemed=cashback.coupon.redeemed.queue
rabbitmq.routingkey.coupon-redeemed=coupon.redeemed

rabbitmq.exchange.cashback=deals.cashback.exchange
rabbitmq.routingkey.cashback-credited=cashback.credited

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
