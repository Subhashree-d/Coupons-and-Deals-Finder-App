spring.application.name=admin-service
server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/admin_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Logesh@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Resilience4j Circuit Breaker Config for Admin Downstream Services
resilience4j.circuitbreaker.instances.paymentAdminService.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentAdminService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentAdminService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentAdminService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.paymentAdminService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.couponAdminService.sliding-window-size=5
resilience4j.circuitbreaker.instances.couponAdminService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.couponAdminService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.couponAdminService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.couponAdminService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.merchantAdminService.sliding-window-size=5
resilience4j.circuitbreaker.instances.merchantAdminService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.merchantAdminService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.merchantAdminService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.merchantAdminService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.subscriptionAdminService.sliding-window-size=5
resilience4j.circuitbreaker.instances.subscriptionAdminService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.subscriptionAdminService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.subscriptionAdminService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.subscriptionAdminService.permitted-number-of-calls-in-half-open-state=2

# Resilience4j Retry Config
resilience4j.retry.instances.paymentAdminService.max-attempts=3
resilience4j.retry.instances.paymentAdminService.wait-duration=500ms

resilience4j.retry.instances.couponAdminService.max-attempts=3
resilience4j.retry.instances.couponAdminService.wait-duration=500ms

resilience4j.retry.instances.merchantAdminService.max-attempts=3
resilience4j.retry.instances.merchantAdminService.wait-duration=500ms

resilience4j.retry.instances.subscriptionAdminService.max-attempts=3
resilience4j.retry.instances.subscriptionAdminService.wait-duration=500ms

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,circuitbreakers
